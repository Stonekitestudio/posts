# Copy to .github/workflows/post.yml in the poster repo (social/export.mjs does this).
# Posts whatever approved post is due and saves the record (posted.json).
# Stats are pulled on the Mac into the private repo (social/publish/stats.mjs), never here.
# GitHub's 15-minute schedule only ran about every 6 hours in Nov 2026 (the Nov 19 morning post
# was held for being late). So a run that finds a post due within 5.5 hours waits for it and
# posts on time (WAIT_AHEAD_MIN). Optional extra: social/publish/mac-nudge (not installed).
# Extra runs are harmless: posted.json stops repeats.
name: post
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be posted, post nothing
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # room to wait up to 5.5 hours for a post
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Post what's due
        run: node publish/post.mjs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          ALT_TEXT: '1'  # Instagram accepted alt text in the rehearsal, 2026-11-18
          WAIT_AHEAD_MIN: '330'
      - name: Save the record
        if: always()
        run: |
          git config user.name "stonekite-poster"
          git config user.email "actions@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%FT%RZ)" && git pull --rebase && git push)
